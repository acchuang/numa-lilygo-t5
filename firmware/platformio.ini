[platformio]
boards_dir = boards
default_envs = T5-ePaper

[env:T5-ePaper]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper
upload_port = /dev/cu.usbserial-54250266921
monitor_port = /dev/cu.usbserial-54250266921
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DLILYGO_T5_EPD47
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DESP_EXT1_WAKEUP_ANY_LOW=ESP_EXT1_WAKEUP_ALL_LOW
lib_deps =
    lennarthennigs/Button2 @ 2.3.2
    bblanchon/ArduinoJson @ ^7.4.2
